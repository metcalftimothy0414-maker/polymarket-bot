# Safety gate: no feed makes a live network call while this is false.
# Keep false on dev machines; set true only on the VPS deployment.
data_collection_enabled: false

feeds:
  polymarket:
    categories: ["sports"]       # server-side filter; every sports market returns "sports" here regardless of league
    leagues: ["mlb", "f", "fwc"] # client-side filter on slug league-code: MLB (in season) + FIFA World Cup (in progress, highest 24h volume of any league). nba excluded — offseason until October.
    watchlist_slugs: []          # explicit market slugs to stream; empty = auto-fill from the leagues above
    max_markets_per_connection: 100
    rest_rate_limit_per_sec: 20
    discovery_refresh_seconds: 3600
    transport: "ws"              # "rest_poll" is a fallback for networks that block WS auth
    rest_poll_seconds: 3.0
  kalshi:
    enabled: true
    poll_seconds: 15
    base_url: "https://external-api.kalshi.com/trade-api/v2"
  odds_api:
    # docs/ODDS_API_AUDIT.md: poll_seconds=30 with 2 verified sport_keys
    # burned the whole 500-credit/month free tier in ~2 hours. This config
    # projects to ~360 credits/month — under monthly_credit_budget, which
    # is the hard stop regardless (see bot.odds_api_budget).
    enabled: true
    poll_interval_seconds: 14400   # 4h
    base_url: "https://api.the-odds-api.com"
    regions: ["us"]
    markets: ["h2h"]
    monthly_credit_budget: 400
    alert_at_remaining_pct: 20

strategies:
  kalshi_divergence:
    enabled: true
    entry_threshold_cents: 4.0
    fill_timeout_seconds: 60
  sportsbook_divergence:
    enabled: true
    entry_threshold_cents: 4.0
    fill_timeout_seconds: 60
    # Reference signal only — enforced in code (bot.strategies.base.
    # NON_TRADEABLE_STRATEGY_IDS / bot.paper.open_position), not by this
    # flag. See SPEC.md.
    tradeable: false
  locked_pair_arb:
    enabled: true
    min_abs_edge_cents: 1.0        # build prompt §5.4 default
    hurdle_annual_return: 0.25     # build prompt §5.4 default; set to your actual return threshold
    min_viable_size: 1
    max_size_per_pair: 50
    notional_usd_cap: 50           # small on purpose — this is still Phase 3 paper trading
    settlement_lag_days: 2.0       # placeholder; not yet measured empirically (build prompt §5.4)
    p_divergence: 0.02             # pessimistic prior; calibrate per category once settlements accumulate
    asymmetry: 0.85

# Category expansion (see docs/CATEGORY_EXPANSION.md). Non-sports pairs
# are discovered/matched/scored/logged but never tradeable by default —
# observe_only_categories is enforced in code
# (bot.matching.cli._interactive_review), not just here.
universe:
  categories_enabled: ["sports", "economic_indicator", "politics_elections", "numeric_threshold", "generic"]
  observe_only_categories: ["economic_indicator", "politics_elections", "numeric_threshold", "generic"]
  max_days_to_resolution: 365

gates:
  min_net_edge_cents: 1.0
  min_annual_return: 0.25
  max_reviewable_tier: 3   # tier 4-5 pairs are logged but excluded from `bot pairs-review` by default

polling:
  tier_a_seconds: 15.0     # verified pairs — matches feeds.kalshi.poll_seconds, unchanged cadence
  tier_b_seconds: 60.0     # unverified candidates, tier <= gates.max_reviewable_tier
  tier_c_seconds: 600.0    # everything else — metadata-only (bot.universe catalog refresh), no book polling
  max_requests_per_minute:
    kalshi: 1200           # Basic tier: ~20 req/s, verified live 2026-08-09
    polymarket_us: 1200    # 20 req/s per API key, docs.polymarket.us/api-reference/rate-limits, verified live 2026-08-09

position_notional_usd: 10
max_concurrent_positions: 5     # global, across strategies
daily_sim_loss_stop_usd: 50     # per strategy — one dying doesn't halt the other

log:
  level: INFO
  file: "data/bot.log"
